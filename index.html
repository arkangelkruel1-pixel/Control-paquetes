<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Paquetes con Escáner</title>
    <!-- Librería de QuaggaJS para leer códigos de barras -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #219653;
        }
        #btn-escanear {
            background-color: #2980b9;
            margin-bottom: 10px;
        }
        #btn-escanear:hover {
            background-color: #1f618d;
        }
        #interactive {
            margin-bottom: 15px;
            border: 2px dashed #2980b9;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        /* Ajuste para que el video de la cámara se adapte bien al contenedor */
        #interactive video, #interactive canvas {
            width: 100% !important;
            height: auto !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registrar Paquete</h2>
        
        <form id="form-paquete">
            <div class="form-group">
                <label for="numero-paquete">Número de Paquete / Guía:</label>
                <!-- Botón para activar la cámara -->
                <button type="button" id="btn-escanear">📷 Escanear con la cámara</button>
                
                <!-- Visor de la cámara (Oculto al inicio) -->
                <div id="interactive" style="display: none;"></div>

                <input type="text" id="numero-paquete" placeholder="Ej. 123456789" required>
            </div>

            <button type="submit" id="btn-guardar">Guardar Paquete</button>
        </form>
    </div>

    <script>
        const btnEscanear = document.getElementById('btn-escanear');
        const visorCamara = document.getElementById('interactive');
        const inputPaquete = document.getElementById('numero-paquete');

        btnEscanear.addEventListener('click', function() {
            // Mostramos el espacio de la cámara
            visorCamara.style.display = 'block';

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: visorCamara,
                    constraints: {
                        facingMode: "environment" // Usa la cámara trasera del celular
                    },
                },
                decoder: {
                    readers: ["code_128_reader", "ean_reader", "upc_reader"] // Formatos comunes de códigos de barras
                }
            }, function(err) {
                if (err) {
                    console.error("Error al iniciar la cámara:", err);
                    alert("No se pudo iniciar la cámara. Revisa los permisos.");
                    visorCamara.style.display = 'none';
                    return;
                }
                Quagga.start();
            });

            // Acción cuando detecta un código correctamente
            Quagga.onDetected(function(result) {
                var codigoDetectado = result.codeResult.code;
                
                // Rellena el input automáticamente
                inputPaquete.value = codigoDetectado;

                // Detiene la cámara y oculta el visor
                Quagga.stop();
                visorCamara.style.display = 'none';
                
                alert("¡Código escaneado con éxito: " + codigoDetectado + "!");
            });
        });

        // Acción al enviar el formulario
        document.getElementById('form-paquete').addEventListener('submit', function(e) {
            e.preventDefault();
            const valor = inputPaquete.value;
            alert("Paquete guardado correctamente: " + valor);
            // Aquí puedes agregar tu lógica para guardarlo en la lista o almacenamiento
            this.reset();
        });
    </script>

</body>
</html>
