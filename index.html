<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Paquetes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 15px; color: #333; }
        .container { max-width: 450px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .config-box { background: #dcdde1; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
        .stats-box { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; background: #eef2f3; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-weight: bold; font-size: 12px; text-align: center; }
        input[type="number"], input[type="text"] { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 10px; color: white; font-size: 14px; }
        .btn-set { background-color: #34495e; }
        .btn-primary { background-color: #27ae60; }
        .btn-scanner { background-color: #2980b9; }
        .btn-secondary { background-color: #8e44ad; }
        .btn-danger { background-color: #c0392b; display: none; }
        .status-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 10px; }
        .btn-status { font-size: 12px; padding: 8px 4px; }
        #interactive { margin-bottom: 15px; border: 2px dashed #2980b9; display: none; }
        #interactive video { width: 100% !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Control de Paquetes</h2>
    
    <div class="config-box">
        <label>Total de paquetes recibidos:</label>
        <input type="number" id="input-total" placeholder="Ej. 10">
        <button type="button" class="btn-set" onclick="establecerTotal()">Establecer Meta</button>
    </div>

    <div class="stats-box">
        <div>Meta:<br><span id="meta-total">0</span></div>
        <div>A Entregar:<br><span id="contador-faltantes">0</span></div>
        <div>Hechos:<br><span id="contador-procesados">0</span></div>
    </div>

    <button type="button" class="btn-secondary" id="btn-progreso">📊 Progreso de Trabajadores</button>

    <form id="form-paquete">
        <button type="button" id="btn-escanear" class="btn-scanner">📷 Escanear Código</button>
        <div id="interactive"></div>
        <input type="text" id="numero-paquete" placeholder="Código de paquete" required>
        
        <label>Estado del paquete:</label>
        <div class="status-options">
            <button type="button" class="btn-status" style="background:#27ae60" onclick="setEstado('Entregado')">Entregado</button>
            <button type="button" class="btn-status" style="background:#f39c12" onclick="setEstado('Reintentar')">Reintentar</button>
            <button type="button" class="btn-status" style="background:#e74c3c" onclick="setEstado('No entregado')">No se pudo</button>
        </div>
        <input type="hidden" id="estado-seleccionado" value="Entregado">
        <button type="submit" class="btn-primary">Guardar Registro</button>
    </form>

    <button type="button" class="btn-danger" id="btn-finalizar">🏁 Finalizar Ruta</button>
</div>

<script>
    let metaTotal = 0;
    let procesados = 0;

    function establecerTotal() {
        metaTotal = parseInt(document.getElementById('input-total').value);
        if(isNaN(metaTotal)) return alert("Pon un número válido");
        document.getElementById('meta-total').innerText = metaTotal;
        document.getElementById('contador-faltantes').innerText = metaTotal; // Inicialmente faltan todos
        alert("Meta establecida en: " + metaTotal + " paquetes.");
    }

    function setEstado(e) { document.getElementById('estado-seleccionado').value = e; }

    document.getElementById('btn-escanear').addEventListener('click', function() {
        document.getElementById('interactive').style.display = 'block';
        Quagga.init({ inputStream: { type: "LiveStream", target: document.querySelector('#interactive'), constraints: { facingMode: "environment" } }, decoder: { readers: ["code_128_reader", "ean_reader"] } }, function(err) {
            if (!err) Quagga.start();
        });
        Quagga.onDetected(function(result) {
            document.getElementById('numero-paquete').value = result.codeResult.code;
            Quagga.stop();
            document.getElementById('interactive').style.display = 'none';
        });
    });

    document.getElementById('form-paquete').addEventListener('submit', function(e) {
        e.preventDefault();
        if(procesados >= metaTotal) return alert("Ya completaste la meta.");
        
        procesados++;
        let faltantes = metaTotal - procesados;
        
        document.getElementById('contador-procesados').innerText = procesados;
        document.getElementById('contador-faltantes').innerText = faltantes;
        
        if (procesados >= metaTotal) {
            document.getElementById('btn-finalizar').style.display = 'block';
        }
        
        alert("Paquete guardado. Faltan: " + faltantes);
        this.reset();
    });

    document.getElementById('btn-finalizar').addEventListener('click', function() {
        if(confirm("¿Finalizar ruta?")) { location.reload(); }
    });
</script>
</body>
</html>
