<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Paquetes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 15px; color: #333; }
        .container { max-width: 450px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; color: #2c3e50; margin-top: 0; }
        
        /* Pestañas / Vistas */
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Estilos del Login */
        .login-box { text-align: center; padding: 10px 0; }
        .login-box input { text-align: center; font-size: 20px; letter-spacing: 4px; }
        .role-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; margin-bottom: 10px; }
        .badge-admin { background-color: #8e44ad; }
        .badge-employee { background-color: #2980b9; }

        .counter-box { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .counter-box .number { font-size: 32px; font-weight: bold; color: #2ecc71; margin-top: 5px; }

        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 10px; color: white; font-size: 15px; font-weight: bold; }
        
        .btn-primary { background-color: #27ae60; }
        .btn-scanner { background-color: #2980b9; }
        .btn-excel { background-color: #16a085; }
        .btn-logout { background-color: #7f8c8d; margin-top: 15px; }
        .btn-danger { background-color: #c0392b; }
        .btn-delete { background-color: #e74c3c; width: auto; padding: 4px 8px; font-size: 12px; margin: 0; }
        
        #interactive { margin-bottom: 15px; border: 2px dashed #2980b9; display: none; border-radius: 8px; overflow: hidden; }
        #interactive video { width: 100% !important; }
        
        .list-container { margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px; }
        .package-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 8px; font-size: 13px; }
        .package-info { display: flex; flex-direction: column; }
        .package-time { font-size: 11px; color: #7f8c8d; margin-top: 2px; }

        /* Búsqueda Admin */
        .search-box { margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">

    <!-- ================= 1. VISTA DE LOGIN (LOBBY INICIAL) ================= -->
    <div id="view-login" class="view-section active">
        <h2>🔐 Acceso al Sistema</h2>
        <div class="login-box">
            <p style="font-size: 14px; color: #7f8c8d;">Ingresa tu clave de acceso:</p>
            <input type="password" id="input-password" placeholder="••••" maxlength="10">
            <button type="button" class="btn-primary" onclick="validarAcceso()">Ingresar</button>
        </div>
    </div>

    <!-- ================= 2. VISTA EMPLEADO (REGISTRO) ================= -->
    <div id="view-employee" class="view-section">
        <div style="text-align: center;">
            <span class="role-badge badge-employee">👨‍💻 Módulo Trabajador</span>
        </div>
        <h2>📦 Registro de Paquetes</h2>
        
        <div class="counter-box">
            <div>Paquetes Registrados Hoy</div>
            <div class="number" id="emp-total-paquetes">0</div>
        </div>

        <form id="form-paquete">
            <button type="button" id="btn-escanear" class="btn-scanner">📷 Escanear Código</button>
            <div id="interactive"></div>
            
            <input type="text" id="numero-paquete" placeholder="Código del paquete" required autocomplete="off">
            <button type="submit" class="btn-primary">➕ Guardar Paquete</button>
        </form>

        <div class="list-container">
            <h3>📋 Mis Útimos Registros</h3>
            <div id="emp-lista-paquetes"></div>
        </div>

        <button type="button" class="btn-logout" onclick="cerrarSesion()">🔒 Cerrar Sesión</button>
    </div>

    <!-- ================= 3. VISTA ADMINISTRADOR (LOBBY ESPECIAL) ================= -->
    <div id="view-admin" class="view-section">
        <div style="text-align: center;">
            <span class="role-badge badge-admin">👑 Panel de Administrador</span>
        </div>
        <h2>👑 Control General de Bodega</h2>

        <div class="counter-box" style="background: #8e44ad;">
            <div>Total General de Paquetes en Base de Datos</div>
            <div class="number" id="admin-total-paquetes" style="color: #f1c40f;">0</div>
        </div>

        <div class="search-box">
            <input type="text" id="input-buscar" placeholder="🔍 Buscar código de paquete..." onkeyup="filtrarPaquetesAdmin()">
        </div>

        <button type="button" class="btn-excel" onclick="exportarExcel()">📊 Descargar Reporte Completo (Excel / CSV)</button>

        <div class="list-container">
            <h3>📂 Todos los Paquetes Registrados</h3>
            <div id="admin-lista-paquetes"></div>
        </div>

        <button type="button" class="btn-danger" style="margin-top: 20px;" onclick="limpiarRegistros()">⚠️ Borrar Toda la Base de Datos</button>
        <button type="button" class="btn-logout" onclick="cerrarSesion()">🔒 Cerrar Sesión</button>
    </div>

</div>

<script>
    // Claves de acceso configuradas
    const CLAVE_ADMIN = "3312";
    const CLAVE_EMPLEADO = "1234";

    let paquetes = JSON.parse(localStorage.getItem('paquetesBodega')) || [];
    let usuarioActual = null; // 'admin' o 'empleado'

    // Validar contraseña
    function validarAcceso() {
        const pass = document.getElementById('input-password').value.trim();
        
        if (pass === CLAVE_ADMIN) {
            usuarioActual = 'admin';
            mostrarVista('view-admin');
            renderizarAdmin();
            document.getElementById('input-password').value = '';
        } else if (pass === CLAVE_EMPLEADO) {
            usuarioActual = 'empleado';
            mostrarVista('view-employee');
            renderizarEmpleado();
            document.getElementById('input-password').value = '';
        } else {
            alert("❌ Contraseña incorrecta. Inténtalo de nuevo.");
            document.getElementById('input-password').value = '';
        }
    }

    // Cambiar de vista en pantalla
    function mostrarVista(idVista) {
        document.querySelectorAll('.view-section').forEach(seccion => {
            seccion.classList.remove('active');
        });
        document.getElementById(idVista).classList.add('active');
    }

    // Cerrar sesión
    function cerrarSesion() {
        if (typeof Quagga !== 'undefined' && Quagga.stop) {
            try { Quagga.stop(); } catch(e){}
        }
        document.getElementById('interactive').style.display = 'none';
        usuarioActual = null;
        mostrarVista('view-login');
    }

    // --- ESCÁNER DE CÓDIGOS ---
    document.getElementById('btn-escanear').addEventListener('click', function() {
        const visor = document.getElementById('interactive');
        visor.style.display = 'block';
        
        Quagga.init({ 
            inputStream: { 
                type: "LiveStream", 
                target: visor, 
                constraints: { facingMode: "environment" } 
            }, 
            decoder: { readers: ["code_128_reader", "ean_reader", "upc_reader", "code_39_reader"] } 
        }, function(err) {
            if (err) {
                alert("Error al abrir la cámara. Revisa los permisos.");
                visor.style.display = 'none';
                return;
            }
            Quagga.start();
        });
        
        Quagga.onDetected(function(result) {
            document.getElementById('numero-paquete').value = result.codeResult.code;
            Quagga.stop();
            visor.style.display = 'none';
        });
    });

    // --- GUARDAR PAQUETE (EMPLEADO) ---
    document.getElementById('form-paquete').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let codigoInput = document.getElementById('numero-paquete');
        let codigo = codigoInput.value.trim();
        
        if (!codigo) return;

        let existe = paquetes.find(p => p.codigo === codigo);
        if (existe) {
            alert(`⚠️ El paquete "${codigo}" ya fue registrado anteriormente el ${existe.fecha} a las ${existe.hora}.`);
            codigoInput.value = '';
            return;
        }

        let ahora = new Date();
        let horaFormateada = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        let fechaFormateada = ahora.toLocaleDateString();

        paquetes.unshift({
            codigo: codigo,
            hora: horaFormateada,
            fecha: fechaFormateada
        });

        guardarEnStorage();
        renderizarEmpleado();
        codigoInput.value = '';
    });

    // --- FUNCIONES RENDERIZADO ---
    function guardarEnStorage() {
        localStorage.setItem('paquetesBodega', JSON.stringify(paquetes));
    }

    // Vista Empleado
    function renderizarEmpleado() {
        document.getElementById('emp-total-paquetes').innerText = paquetes.length;
        const contenedor = document.getElementById('emp-lista-paquetes');

        if (paquetes.length === 0) {
            contenedor.innerHTML = '<p style="text-align: center; color: #7f8c8d; font-size: 13px;">No hay paquetes registrados.</p>';
            return;
        }

        contenedor.innerHTML = '';
        paquetes.slice(0, 10).forEach((p) => { // Muestra los últimos 10
            contenedor.innerHTML += `
                <div class="package-item">
                    <div class="package-info">
                        <span>📦 <b>${p.codigo}</b></span>
                        <span class="package-time">📅 ${p.fecha} - ⏰ ${p.hora}</span>
                    </div>
                </div>
            `;
        });
    }

    // Vista Administrador
    function renderizarAdmin(listaFiltrada = null) {
        let datos = listaFiltrada || paquetes;
        document.getElementById('admin-total-paquetes').innerText = paquetes.length;
        const contenedor = document.getElementById('admin-lista-paquetes');

        if (datos.length === 0) {
            contenedor.innerHTML = '<p style="text-align: center; color: #7f8c8d; font-size: 13px;">No se encontraron registros.</p>';
            return;
        }

        contenedor.innerHTML = '';
        datos.forEach((p, index) => {
            contenedor.innerHTML += `
                <div class="package-item">
                    <div class="package-info">
                        <span>📦 <b>${p.codigo}</b></span>
                        <span class="package-time">📅 ${p.fecha} - ⏰ ${p.hora}</span>
                    </div>
                    <button type="button" class="btn-delete" onclick="eliminarPaqueteAdmin(${index})">❌ Borrar</button>
                </div>
            `;
        });
    }

    // Filtrar/Buscar Paquetes en Admin
    function filtrarPaquetesAdmin() {
        let busqueda = document.getElementById('input-buscar').value.toLowerCase().trim();
        let filtrados = paquetes.filter(p => p.codigo.toLowerCase().includes(busqueda));
        renderizarAdmin(filtrados);
    }

    // Eliminar individual (Solo Admin)
    function eliminarPaqueteAdmin(index) {
        if (confirm("¿Estás seguro de eliminar este paquete del registro?")) {
            paquetes.splice(index, 1);
            guardarEnStorage();
            renderizarAdmin();
        }
    }

    // Borrar todo la base de datos (Solo Admin)
    function limpiarRegistros() {
        if (confirm("🚨 ATENCIÓN: ¿Estás seguro de borrar TODOS los paquetes registrados? Esta acción no se puede deshacer.")) {
            paquetes = [];
            guardarEnStorage();
            renderizarAdmin();
            alert("Base de datos reiniciada a cero.");
        }
    }

    // Exportar Excel/CSV (Solo Admin)
    function exportarExcel() {
        if (paquetes.length === 0) return alert("No hay datos cargados para exportar.");

        let csvContent = "data:text/csv;charset=utf-8,Codigo,Fecha,Hora\n";
        paquetes.forEach(p => {
            csvContent += `"${p.codigo}","${p.fecha}","${p.hora}"\n`;
        });

        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Reporte_Bodega_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
