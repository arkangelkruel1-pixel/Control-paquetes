<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Bodega - Sistema Completo</title>
    <!-- Librería universal para códigos de barras, circulares, QR y DataMatrix -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 15px; background: #f0f2f5; color: #333; }
        h1 { text-align: center; font-size: 20px; color: #2c3e50; }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-main { background: #3498db; color: white; border: none; font-weight: bold; }
        .btn-add { background: #e67e22; color: white; border: none; font-weight: bold; }
        .btn-camera { background: #8e44ad; color: white; border: none; font-weight: bold; }
        .btn-stop { background: #c0392b; color: white; border: none; font-weight: bold; display: none; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; width: auto; font-size: 12px; border-radius: 4px; }
        .btn-logout { background: #95a5a6; color: white; border: none; font-weight: bold; margin-top: 15px; }
        .batch-item { background: #fff3cd; border-left: 4px solid #ffc107; padding: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; font-size: 14px; }
        .counter-box { background: #2c3e50; color: white; text-align: center; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .counter-number { font-size: 32px; font-weight: bold; margin-top: 5px; color: #2ecc71; }
        
        /* Estilos de la tabla de administración */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #2c3e50; color: white; padding: 10px; text-align: left; font-size: 13px; }
        td { padding: 8px; border-bottom: 1px solid #ddd; font-size: 13px; }
        .worker-section { margin-bottom: 20px; border-left: 5px solid #3498db; padding-left: 10px; }
        .hidden { display: none; }
        #interactive { width: 100%; min-height: 250px; background: #000; border-radius: 8px; margin-top: 10px; display: none; position: relative; overflow: hidden; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginScreen" class="card" style="max-width: 400px; margin: 50px auto; text-align: center;">
        <h3>🔒 Acceso al Sistema</h3>
        <p style="font-size: 14px; color: #666;">Ingresa tu clave (Trabajador o Admin)</p>
        <input type="password" id="accessPassword" placeholder="••••" style="text-align: center; font-size: 18px; letter-spacing: 5px;">
        <button class="btn-main" onclick="checkPassword()">Ingresar</button>
    </div>

    <!-- PANEL TRABAJADOR (1234) -->
    <div id="workerApp" class="hidden">
        <h1>📦 Panel de Escaneo</h1>

        <div class="counter-box">
            <div>Paquetes Registrados Hoy</div>
            <div class="counter-number" id="todayCount">0</div>
        </div>

        <div class="card">
            <h3>Datos del Repartidor</h3>
            <input type="text" id="assignedWorker" placeholder="Nombre del Repartidor">
        </div>

        <!-- AMBAS OPCIONES EN UN MISMO CUADRITO -->
        <div class="card" style="border-left: 5px solid #3498db;">
            <h3>📦 Registro de Paquetes</h3>
            
            <!-- 1. Ingreso Manual -->
            <label style="font-size: 13px; font-weight: bold; color: #555;">Ingreso Manual:</label>
            <input type="text" id="manualPackageId" placeholder="Ej. 103" onkeypress="handleManualKeypress(event)">
            <button class="btn-add" onclick="addManualToList()">➕ Agregar Manual a la Lista</button>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

            <!-- 2. Escaneo con Cámara -->
            <label style="font-size: 13px; font-weight: bold; color: #555;">O Escanear con Cámara:</label>
            <div id="interactive"></div>
            <button class="btn-camera" id="btnStartCam" onclick="startScanner()">📷 Activar Cámara</button>
            <button class="btn-stop" id="btnStopCam" onclick="stopScanner()">❌ Detener Cámara</button>
        </div>

        <div class="card">
            <h3>Lote Actual (<span id="batchCount">0</span>)</h3>
            <div id="batchList" style="margin-bottom: 15px;">No hay paquetes en el lote actual.</div>
            <button class="btn-main" onclick="saveBatchToCloud()">🚀 Guardar Lote en la Nube</button>
        </div>

        <button class="btn-logout" onclick="logout()">🔒 Cerrar Sesión</button>
    </div>

    <!-- PANEL ADMIN CON BÚSQUEDA (3312) -->
    <div id="adminApp" class="hidden">
        <h1>📊 Dashboard de Administración</h1>

        <!-- BARRA DE BÚSQUEDA Y FILTROS -->
        <div class="card" style="border-left: 5px solid #e67e22;">
            <h3>🔍 Filtros y Búsqueda</h3>
            <input type="text" id="adminSearch" placeholder="Buscar por número de guía o repartidor..." oninput="filterAndRenderAdmin()">
        </div>

        <div id="adminDashboardContent">
            <div class="card">Cargando reportes detallados...</div>
        </div>
        <button class="btn-logout" onclick="logout()">🔒 Cerrar Sesión</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyACQrmgeHFIargzZLAVbg5YdSCNu7Txmzs",
          authDomain: "bodega-3e097.firebaseapp.com",
          projectId: "bodega-3e097",
          storageBucket: "bodega-3e097.appspot.com",
          messagingSenderId: "981340766070",
          appId: "1:981340766070:web:f3c98301285c9e4d928457"
        };
        const db = getFirestore(initializeApp(firebaseConfig));

        let localBatch = [];
        let html5QrCode = null;
        let globalSnapshotDocs = [];

        window.checkPassword = function() {
            const pass = document.getElementById('accessPassword').value;
            if(pass === "1234") {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('workerApp').classList.remove('hidden');
            } else if(pass === "3312") {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminApp').classList.remove('hidden');
            } else {
                alert("Clave incorrecta");
            }
        };

        window.logout = function() {
            stopScanner();
            localBatch = [];
            renderBatch();
            document.getElementById('manualPackageId').value = '';
            document.getElementById('assignedWorker').value = '';
            document.getElementById('accessPassword').value = '';
            document.getElementById('adminSearch').value = '';
            document.getElementById('workerApp').classList.add('hidden');
            document.getElementById('adminApp').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        };

        // CÁMARA
        window.startScanner = function() {
            document.getElementById('interactive').style.display = 'block';
            document.getElementById('btnStartCam').style.display = 'none';
            document.getElementById('btnStopCam').style.display = 'block';

            html5QrCode = new Html5Qrcode("interactive");
            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                (decodedText) => {
                    if (navigator.vibrate) navigator.vibrate(100);
                    addToListFromCamera(decodedText);
                    stopScanner();
                },
                (errorMessage) => {}
            ).catch((err) => {
                alert("No se pudo iniciar la cámara: " + err);
                stopScanner();
            });
        };
        
        window.stopScanner = function() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                }).catch(err => {
                    console.error("Error al detener la cámara", err);
                });
            }
            document.getElementById('interactive').style.display = 'none';
            document.getElementById('btnStartCam').style.display = 'block';
            document.getElementById('btnStopCam').style.display = 'none';
        };

        function addToListFromCamera(code) {
            if(!code) return;
            if(localBatch.includes(code)) { alert("Este código ya está en la lista."); return; }
            localBatch.push(code);
            renderBatch();
        }

        // AGREGAR MANUALMENTE
        window.addManualToList = function() {
            const id = document.getElementById('manualPackageId').value.trim();
            if(!id) { alert("Por favor, ingresa el número de paquete (ej. 103)."); return; }
            if(localBatch.includes(id)) { alert("Este número ya está en la lista."); return; }
            localBatch.push(id);
            document.getElementById('manualPackageId').value = '';
            renderBatch();
        };

        window.handleManualKeypress = function(event) {
            if(event.key === 'Enter') {
                event.preventDefault();
                window.addManualToList();
            }
        };

        window.removeFromBatch = function(index) {
            localBatch.splice(index, 1);
            renderBatch();
        };

        function renderBatch() {
            document.getElementById('batchCount').innerText = localBatch.length;
            let html = "";
            localBatch.forEach((code, index) => {
                html += `<div class="batch-item">
                    <span><strong>Guía/Número:</strong> ${code}</span>
                    <button class="btn-delete" onclick="removeFromBatch(${index})">Quitar</button>
                </div>`;
            });
            document.getElementById('batchList').innerHTML = html || "No hay paquetes en el lote actual.";
        }

        window.saveBatchToCloud = async function() {
            const worker = document.getElementById('assignedWorker').value.trim();
            if(!worker) { alert("Ingresa el nombre del repartidor."); return; }

            const manualVal = document.getElementById('manualPackageId').value.trim();
            if(manualVal) {
                if(!localBatch.includes(manualVal)) {
                    localBatch.push(manualVal);
                }
                document.getElementById('manualPackageId').value = '';
                renderBatch();
            }

            if(localBatch.length === 0) { alert("El lote está vacío. Ingresa o escanea un paquete."); return; }

            try {
                for(let code of localBatch) {
                    await addDoc(collection(db, "packages"), {
                        trackingId: code,
                        assignedWorker: worker,
                        timestamp: new Date()
                    });
                }
                alert("¡Lote de " + localBatch.length + " paquetes guardado con éxito!");
                localBatch = [];
                renderBatch();
            } catch (e) {
                alert("Error al guardar: " + e.message);
            }
        };

        // ADMIN Y DASHBOARD EN TIEMPO REAL CON FILTRO DE BÚSQUEDA
        const q = query(collection(db, "packages"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            globalSnapshotDocs = [];
            snapshot.forEach((doc) => {
                globalSnapshotDocs.push(doc.data());
            });
            filterAndRenderAdmin();
        });

        window.filterAndRenderAdmin = function() {
            const searchText = document.getElementById('adminSearch').value.toLowerCase().trim();
            const workerData = {};
            let countToday = 0;
            const hoy = new Date().toDateString();

            globalSnapshotDocs.forEach((p) => {
                const worker = p.assignedWorker || "Sin Nombre";
                const trackingId = String(p.trackingId || "").toLowerCase();
                const workerLower = worker.toLowerCase();

                // Verificar si coincide con la búsqueda
                const matchesSearch = searchText === "" || trackingId.includes(searchText) || workerLower.includes(searchText);

                if(p.timestamp) {
                    const fechaDoc = p.timestamp.toDate ? p.timestamp.toDate() : new Date(p.timestamp);
                    if(fechaDoc.toDateString() === hoy) {
                        countToday++;
                    }
                    
                    if(matchesSearch) {
                        if(!workerData[worker]) {
                            workerData[worker] = [];
                        }
                        workerData[worker].push({
                            trackingId: p.trackingId,
                            time: fechaDoc.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                        });
                    }
                }
            });

            document.getElementById('todayCount').innerText = countToday;

            let html = "";
            for(let worker in workerData) {
                html += `<div class="card worker-section">
                    <h3>👤 ${worker} <span style="font-size:13px; color:#666; font-weight:normal;">(${workerData[worker].length} paquetes mostrados)</span></h3>
                    <table>
                        <tr><th>Nº de Guía / Paquete</th><th>Hora de Registro</th></tr>
                        ${workerData[worker].map(item => `
                            <tr>
                                <td><strong>${item.trackingId}</strong></td>
                                <td>${item.time}</td>
                            </tr>
                        `).join('')}
                    </table>
                </div>`;
            }
            document.getElementById('adminDashboardContent').innerHTML = html || "<div class='card'>No se encontraron resultados para la búsqueda.</div>";
        };
    </script>
</body>
</html>
